plugins {
	id 'org.springframework.boot' version '4.1.1' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
	group = 'com.getddo'
	version = '0.0.1-SNAPSHOT'
	ext.mapstructVersion = '1.6.3'

	repositories {
		mavenCentral()
	}
}

// storage는 경로 구분용 프로젝트이며, 실제 Java 모듈만 설정한다.
configure([project(':api'), project(':core'), project(':storage:db'), project(':storage:s3'), project(':storage:redis')]) {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	dependencyManagement {
		imports {
			mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
		}
	}

	dependencies {
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}

// 저장소별 실제 연결 테스트를 일반 단위 테스트와 분리한다.
configure([project(':api'), project(':storage:db'), project(':storage:redis')]) {
	sourceSets {
		integrationTest {
			compileClasspath += sourceSets.main.output
			runtimeClasspath += sourceSets.main.output
		}
	}

	configurations {
		integrationTestImplementation.extendsFrom testImplementation
		integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
	}

	dependencies {
		integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	}

	def integrationTest = tasks.register('integrationTest', Test) {
		description = '각 모듈의 실제 저장소 연결 통합 테스트를 실행한다.'
		group = 'verification'
		testClassesDirs = sourceSets.integrationTest.output.classesDirs
		classpath = sourceSets.integrationTest.runtimeClasspath
		useJUnitPlatform()
		shouldRunAfter tasks.named('test')
	}

	tasks.named('check') {
		dependsOn integrationTest
	}
}

// Redis 모듈은 MySQL 테스트 픽스처·드라이버에 의존하지 않는다.
configure([project(':api'), project(':storage:db')]) {
	dependencies {
		integrationTestImplementation(testFixtures(project(':storage:db')))
		integrationTestImplementation 'org.testcontainers:testcontainers-mysql'
	}
}
