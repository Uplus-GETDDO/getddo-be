name: Build

# 병합 차단: main/dev Ruleset에서 "빌드·테스트"를 필수 상태 검사로 등록한다.
# job 이름 변경 시 Ruleset의 검사 이름도 함께 변경해야 한다.
# 분리된 이미지 작업도 필수 검사로 등록한다. 실제 표시 이름은 Actions에서 확인한다.

on:
  # 제목·본문 수정으로는 빌드를 실행하지 않는다.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # 브랜치 최초 push와 PR 병합을 포함한다.
  push:
    branches: [main, dev]

permissions:
  contents: read

# 테스트부터 이미지 생성까지 같은 실행을 함께 취소한다.
concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: PR 제목 규칙 회귀 테스트
        run: python3 .github/tests/test_pr_title.py

      - name: 정기 릴리스 조건 회귀 테스트
        run: |
          python3 .github/tests/test_daily_release.py
          python3 .github/tests/test_publish_release.py

      - name: 배포 스크립트 회귀 검증
        run: python3 -m unittest discover -s .github/tests

      # build.gradle의 Java toolchain 버전과 일치시킨다.
      - name: Java 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: MySQL 통합 테스트용 Docker 확인
        run: docker info

      # build에 단위 테스트·MySQL 통합 테스트·패키징이 포함된다.
      - name: 빌드 및 테스트
        run: ./gradlew build --no-daemon --stacktrace

      - name: 실패한 테스트 보고서 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # 테스트가 성공해야 호출한다. 이미지 작업도 Build 전체 성공 조건에 포함된다.
  image:
    name: 이미지
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/image.yml

  publish-image:
    name: main 이미지
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/image-publish.yml
