plugins {
	id 'org.springframework.boot'
}

dependencies {
	implementation project(':core')
	implementation project(':storage:db')
	implementation project(':storage:s3')

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-cloudwatch2'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation platform('software.amazon.awssdk:bom:2.56.0')
	implementation 'software.amazon.awssdk:netty-nio-client'

	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	testImplementation 'com.zaxxer:HikariCP'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	integrationTestImplementation 'org.springframework:spring-jdbc'
	integrationTestImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
	integrationTestImplementation platform('software.amazon.awssdk:bom:2.56.0')
	integrationTestImplementation 'software.amazon.awssdk:s3'
}

// api만 실행 가능한 JAR로 패키징한다.
tasks.named('jar') {
	enabled = false
}
