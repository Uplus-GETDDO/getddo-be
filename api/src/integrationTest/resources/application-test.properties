# 통합 테스트는 고정 시계와 명시적인 호출로 알림 처리를 검증한다.
getddo.notification.worker.enabled=false
# 기존 API 성공 시나리오는 확정적으로 실행한다. 모의 실패 경로는 전용 테스트에서 강제한다.
getddo.notification.mock.failure-percent=0
# 통합 테스트는 고정 시계와 명시적인 호출로 응모권 만료 처리를 검증한다.
getddo.ticket.expiry.worker.enabled=false

getddo.drawing.initial-worker.enabled=false
# 상태 전환은 고정 시계와 명시적인 서비스 호출로 검증한다.
getddo.event.lifecycle-worker.enabled=false

# 미션 종료 처리는 고정 시계와 명시적인 호출로 검증한다.
getddo.mission.end-worker.enabled=false

# 다른 API 통합 테스트가 같은 사용자 ID로 요청을 반복하므로 빈도 제한은 끈다. 제한 자체는 RateLimitApiIntegrationTest가 켜서 검증한다.
getddo.rate-limit.enabled=false
